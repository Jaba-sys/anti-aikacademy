<!DOCTYPE html>

        body { background-color: #f4f6f9; color: #333; display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar {
            width: 240px; background-color: #f6b319; color: white; display: flex;
            flex-direction: column; flex-shrink: 0; z-index: 10; transition: margin-left 0.3s ease;
        }
        .sidebar.collapsed { margin-left: -240px; }
        .sidebar-header {
            padding: 20px; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px;
            background-color: white; color: #333; border-bottom: 1px solid #e0e0e0; height: 60px;
        }
        .sidebar-header img { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
        .menu { list-style: none; margin-top: 20px; flex-grow: 1; }
        .menu li a {
            padding: 12px 20px; font-size: 14px; font-weight: 500; display: flex;
            align-items: center; gap: 10px; color: white; text-decoration: none;
        }
        .menu li a.active { background-color: #e53e3e; font-weight: bold; } /* Выделим красным, так как это ошибка */
        .sidebar-bottom { padding: 15px; margin-top: auto; }
        .sidebar-bottom img { width: 100%; border-radius: 8px; object-fit: cover; margin-bottom: 10px; }
        .sidebar-footer { padding: 0 15px 15px 15px; font-size: 11px; color: rgba(255, 255, 255, 0.85); line-height: 1.4; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .sidebar-footer a { color: white; font-weight: bold; text-decoration: underline; }
        .sidebar-footer a:hover { color: #eee; }

        /* --- Main Content --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; width: 100%; position: relative; }
        .header { height: 60px; background-color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: 600; }
        .toggle-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #333; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .toggle-btn:hover { background-color: #f0f0f0; border-radius: 4px; }
        .header-right { display: flex; align-items: center; gap: 20px; font-size: 14px; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background-color: #e53e3e; display: flex; justify-content: center; align-items: center; font-size: 11px; color: white; font-weight: bold; }
        
        /* --- Content Area --- */
        .content-area { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .error-card { background-color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 40px; border: 1px solid #e0e0e0; border-top: 6px solid #e53e3e; max-width: 500px; width: 100%; }
        .error-card h1 { font-size: 48px; color: #e53e3e; margin-bottom: 15px; font-weight: bold; }
        .error-card h3 { font-size: 20px; color: #1a202c; margin-bottom: 10px; }
        .error-card p { font-size: 14px; color: #718096; line-height: 1.6; margin-bottom: 25px; }
        .back-btn { display: inline-block; background-color: #f6b319; color: white; text-decoration: none; padding: 12px 24px; font-size: 14px; font-weight: bold; border-radius: 6px; transition: background 0.2s; }
        .back-btn:hover { background-color: #e09e07; }
