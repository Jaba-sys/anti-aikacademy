<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://aik.academy.com.ua/favicon.ico">
    <title>Вхід до системи</title>
    <style>
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 12px; border-top: 5px solid #f6b319; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:disabled { background-color: #f9f9f9; color: #888; cursor: not-allowed; }
        button { background: #f6b319; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h3>🔒 Вхід до системи</h3>
    <div class="input-group">
        <label style="font-size: 12px; color: #666;">Користувач:</label>
        <input type="text" value="Anti-Aikovec" disabled>
    </div>
    <div class="input-group">
        <label style="font-size: 12px; color: #666;">Персональний ключ:</label>
        <input type="password" id="keyInput" placeholder="Введіть ключ">
    </div>
    <button onclick="checkAccess()">Перейти</button>
</div>

<script>
    const targetPath = "c2l0ZS9hbnRpLWFpa2FjYWRlbXkvdXNlcjA5MzI0NTU0OTA0ODQ2L2dvbG92bmEuaHRtbA==";
    const secretArray = [107, 112, 36, 37, 36, 41, 37, 29, 29, 41, 115, 108];

    function checkAccess() {
        const inputKey = document.getElementById("keyInput").value.trim();
        
        console.log("--- ОТЛАДКА ПРОВЕРКИ ---");
        console.log("Введено ключа: " + inputKey);

        let isValid = (inputKey.length === secretArray.length);
        
        if (isValid) {
            for (let i = 0; i < inputKey.length; i++) {
                let calculated = (inputKey.charCodeAt(i) ^ 42) + 10;
                if (calculated !== secretArray[i]) {
                    console.log("Ошибка на символе '" + inputKey[i] + "' (позиция " + (i+1) + ")");
                    console.log("-> Ваш результат: " + calculated + " | Правильный результат: " + secretArray[i]);
                    isValid = false;
                    break;
                }
            }
        } else {
            console.log("Ошибка: длина ключа неверна.");
        }

        if (isValid) {
            console.log("Успех!");
            sessionStorage.setItem("anti_aik_unlocked", "true");
            window.location.href = atob(targetPath);
        } else {
            console.log("Доступ отклонен.");
            alert("Помилка: невірний ключ!");
        }
    }
</script>
</body>
</html>
